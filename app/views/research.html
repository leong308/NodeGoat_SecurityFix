{% extends "./layout.html" %} {% block title %}Research{% endblock %} {% block content %}

<div class="row">
    <div class="col-lg-12">

        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">
                    Stock Market Research
                </h3>
            </div>

            <div class="panel-body">

                <form action="/research" method="get" role="search">
                    <div class="form-group">
                        
                    <!-- (14) Accept a stock symbol only; the server controls the research URL. -->
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Stock Symbol (e.g., AAPL)"
                        name="symbol"
                        maxlength="20"
                        pattern="[A-Za-z0-9.^=-]{1,20}"
                        required
                    />

                        <p class="help-block">Enter Stock Symbol.</p>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>

                <!-- (14) Display a trusted research link after symbol validation. -->
                {% if quoteUrl %}
                <div class="alert alert-info" style="margin-top:15px;">
                    <p>Research result for: <strong>{{ symbol }}</strong></p>
                    <a href="{{ quoteUrl }}"
                    target="_blank"
                    rel="noopener noreferrer">
                        View stock information on Yahoo Finance
                    </a>
                </div>
                {% endif %}


            </div>
        </div>

    </div>
</div>
{% endblock %}
